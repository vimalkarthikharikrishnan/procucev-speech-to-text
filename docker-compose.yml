# Local development database only. Production uses a hosted Postgres (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: procucev
      POSTGRES_PASSWORD: procucev_local
      POSTGRES_DB: procucev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
